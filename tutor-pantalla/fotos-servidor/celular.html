<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Foto para el tutor</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1f2330;--ink2:#555b6b;--ink3:#8a8f9c;--line:#e3dfd6;--acc:#3b57c9;--acc-soft:#e8ecfb;--ok:#1f8a4c;--ok-soft:#e3f4ea;--mal:#b3261e;--mal-soft:#fbe7e5;--on-acc:#fff}
@media (prefers-color-scheme: dark){:root{--bg:#1b1d24;--card:#252832;--ink:#eceef3;--ink2:#b8bdc9;--ink3:#8b91a0;--line:#363a46;--acc:#7c95ff;--acc-soft:#2b3150;--ok:#5fcf8d;--ok-soft:#203a2b;--mal:#ff8a80;--mal-soft:#422423;--on-acc:#10152e}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
main{max-width:520px;margin:0 auto;padding:max(20px,env(safe-area-inset-top)) 16px 32px}
h1{font-size:22px;margin:4px 0 2px}
.sub{color:var(--ink2);margin:0 0 18px;font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
label{display:block;font-weight:650;font-size:14px;margin-bottom:8px}
.codigo{display:flex;gap:8px}
.codigo input{flex:1;min-width:0;height:54px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:600 26px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.35em;text-align:center}
button,.boton{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:56px;border:0;border-radius:14px;font:650 17px/1.2 inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.prim{background:var(--acc);color:var(--on-acc)}
.sec{background:var(--acc-soft);color:var(--acc)}
.codigo button{width:auto;padding:0 18px;min-height:54px}
.botones{display:grid;gap:10px}
button:disabled{opacity:.5}
.estado{margin:10px 0 0;font-size:14px;color:var(--ink2)}
.estado.mal{color:var(--mal)}
.lista{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.lista figure{margin:0;position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--bg);border:1px solid var(--line)}
.lista img{width:100%;height:100%;object-fit:cover;display:block}
.lista figcaption{position:absolute;left:0;right:0;bottom:0;padding:3px 6px;font-size:12px;font-weight:650;background:var(--ok-soft);color:var(--ok)}
.lista figure.subiendo figcaption{background:var(--acc-soft);color:var(--acc)}
.lista figure.error figcaption{background:var(--mal-soft);color:var(--mal)}
.nota{font-size:13px;color:var(--ink3);margin:6px 2px 0}
input[type=file]{display:none}
[hidden]{display:none !important}
</style>
</head>
<body>
<main>
  <h1>Foto para el tutor</h1>
  <p class="sub">La foto llega a tu panel; ahí decides si se la mandas al tutor.</p>

  <section class="card" id="paso1">
    <label for="codigo">Código que ves en tu panel</label>
    <div class="codigo">
      <input id="codigo" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000">
      <button class="prim" id="seguir" type="button">Seguir</button>
    </div>
    <p class="estado" id="estado1" hidden></p>
  </section>

  <section class="card" id="paso2" hidden>
    <div class="botones">
      <label class="boton prim" for="camara"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Tomar foto</label>
      <label class="boton sec" for="galeria"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><circle cx="9" cy="10" r="1.8"/><path d="M20.5 16l-5-5-8.5 8.5"/></svg>Elegir de la galería</label>
    </div>
    <input id="camara" type="file" accept="image/*" capture="environment">
    <input id="galeria" type="file" accept="image/*" multiple>
    <p class="estado" id="estado2">Código <b id="codigoTxt"></b>. Puedes mandar varias fotos, una tras otra.</p>
    <div class="lista" id="lista"></div>
  </section>
  <p class="nota">Las fotos solo pasan por aquí: tu panel las recoge en segundos y se borran del servidor. El código caduca a los 10 minutos sin uso.</p>
</main>
<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var codigo = '';
  var LADO = 2000;                       // lado mayor de la foto que se sube

  function aviso(id, t, mal){ var e = $(id); e.hidden = !t; e.textContent = t || ''; e.className = 'estado' + (mal ? ' mal' : ''); }

  function validar(c){
    if (!/^\d{6}$/.test(c)) return aviso('estado1', 'Son 6 números.', true);
    $('seguir').disabled = true; aviso('estado1', 'Comprobando…');
    fetch('/api/codigo/' + c).then(function(r){ return r.json(); }).then(function(d){
      $('seguir').disabled = false;
      if (!d.ok) return aviso('estado1', d.error || 'Código no válido.', true);
      codigo = c; $('codigoTxt').textContent = c;
      $('paso1').hidden = true; $('paso2').hidden = false;
      if (location.pathname !== '/c/' + c) history.replaceState(null, '', '/c/' + c);
    }, function(){ $('seguir').disabled = false; aviso('estado1', 'Sin conexión. Intenta otra vez.', true); });
  }

  // La foto del celular puede pesar 5–10 MB: se reduce aquí (lado mayor 2000 px, JPEG) antes de subirla
  function reducir(archivo){
    return new Promise(function(ok, mal){
      var url = URL.createObjectURL(archivo), im = new Image();
      im.onload = function(){
        var k = Math.min(1, LADO / Math.max(im.naturalWidth, im.naturalHeight));
        var c = document.createElement('canvas'); c.width = Math.round(im.naturalWidth * k); c.height = Math.round(im.naturalHeight * k);
        c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        c.toBlob(function(b){ b ? ok(b) : mal(new Error('no pude preparar la foto')); }, 'image/jpeg', 0.85);
      };
      im.onerror = function(){ URL.revokeObjectURL(url); mal(new Error('no es una imagen')); };
      im.src = url;
    });
  }

  function subir(archivo){
    var fig = document.createElement('figure'); fig.className = 'subiendo';
    fig.innerHTML = '<img alt=""><figcaption>Subiendo…</figcaption>';
    $('lista').insertBefore(fig, $('lista').firstChild);
    var cap = fig.querySelector('figcaption');
    reducir(archivo).then(function(b){
      fig.querySelector('img').src = URL.createObjectURL(b);
      return fetch('/api/subir/' + codigo, {method: 'POST', headers: {'Content-Type': 'image/jpeg'}, body: b});
    }).then(function(r){ return r.json(); }).then(function(d){
      if (!d.ok) throw new Error(d.error || 'No se pudo subir.');
      fig.className = ''; cap.textContent = 'En tu panel';
    }).catch(function(e){
      fig.className = 'error'; cap.textContent = 'No se envió';
      aviso('estado2', e.message || 'No se pudo subir. Intenta otra vez.', true);
    });
  }

  function elegidos(input){ Array.prototype.forEach.call(input.files, subir); input.value = ''; }
  $('camara').onchange = function(){ elegidos(this); };
  $('galeria').onchange = function(){ elegidos(this); };
  $('seguir').onclick = function(){ validar($('codigo').value.trim()); };
  $('codigo').addEventListener('input', function(){ this.value = this.value.replace(/\D/g, '').slice(0, 6); if (this.value.length === 6) validar(this.value); });

  var m = location.pathname.match(/^\/c\/(\d{6})$/);
  if (m){ $('codigo').value = m[1]; validar(m[1]); }
})();
</script>
</body>
</html>
